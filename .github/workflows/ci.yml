name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so setup-node's pnpm cache can resolve.
      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # onlyBuiltDependencies in pnpm-workspace.yaml lets better-sqlite3 build its
      # native binary; without it the sqlite tests can't load bindings.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # docs/api.md ships in package.json#files, so a stale copy goes to npm.
      # Regenerate and fail on a diff — the assembler already refuses to write a
      # file with a dead link, so this also keeps its cross-references honest.
      # One node version is enough; the output does not depend on the runtime.
      # The script is `docs:build`, not `docs`: `pnpm docs` is npm's own command
      # and opens the homepage in a browser, which is why this file went stale
      # for weeks while the documented command exited 0.
      - name: docs are generated, not remembered
        if: matrix.node == 22
        run: |
          pnpm docs:build
          git diff --exit-code --stat -- docs/api.md \
            || { echo "::error::docs/api.md is stale — run 'pnpm docs:build' and commit the result"; exit 1; }
