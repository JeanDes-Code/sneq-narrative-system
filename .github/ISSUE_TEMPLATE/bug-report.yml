name: Bug report
description: Something in sneq-engine is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm ls sneq-engine`, or the version in your lockfile
      placeholder: sneq-engine@0.1.0
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Repository adapter
      options:
        - sqlite
        - memory
        - json
        - not sure / N/A
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest CLI invocation or code snippet that shows the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs observed
    validations:
      required: true
